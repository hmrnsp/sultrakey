[package]
name = "sultrakey"
version = "0.3.2"
edition = "2024"
rust-version = "1.89"
description = "File .env terenkripsi (age X25519) dan peluncur aplikasi dengan value yang sudah dibuka"
repository = "https://github.com/hmrnsp/sultrakey"
readme = "README.md"

[lib]
name = "sultrakey"

[[bin]]
name = "sultrakey"
path = "src/main.rs"

[dependencies]
age = { version = "0.12.1", default-features = false }
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rpassword = "7.5.4"
rustyline = { version = "18.0.1", default-features = false }
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
zeroize = "1.9.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["user", "fs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
